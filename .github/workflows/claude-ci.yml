name: Claude CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: claude-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the pinned Claude validator
        run: npm install --global @anthropic-ai/claude-code@2.1.296
      - name: Check generated output and upstream override locks
        run: node Claude/scripts/build.mjs --check
      - name: Run Claude review regressions
        run: python -m unittest discover -s Claude/scripts -p 'test_*.py'
      - name: Confirm regressions leave generated output current
        run: node Claude/scripts/build.mjs --check
      - name: Validate all Claude marketplace packages
        run: node Claude/scripts/build.mjs --validate
