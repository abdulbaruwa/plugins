name: Codex CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Codex/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install -r Codex/requirements-dev.txt
      - name: Validate Codex packages
        run: python Codex/scripts/validate.py
      - name: Run Codex regressions
        run: python -m unittest discover -s Codex/scripts -p 'test_*.py'
      - name: Check adopted source changes
        run: python Codex/scripts/source_diff.py --head HEAD --check --json > "$RUNNER_TEMP/source-diff-adopted.json"
      - name: Report pending upstream changes
        if: always()
        run: |
          git fetch --no-tags https://github.com/cursor/plugins.git main:refs/remotes/upstream/main
          python Codex/scripts/source_diff.py --head upstream/main --json > "$RUNNER_TEMP/source-diff-upstream.json"
      - name: Upload source comparison reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-source-diff
          path: ${{ runner.temp }}/source-diff-*.json
          if-no-files-found: error
          retention-days: 14

  pstack-statechart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install statechart test dependencies
        run: npm install --prefix Codex/plugins/pstack/skills/statechart/scripts --no-package-lock --no-audit --no-fund
      - name: Prepare pinned TLC
        shell: bash
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "JAVA=$JAVA_HOME_17_X64/bin/java" >> "$GITHUB_ENV"
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"
      - name: Test the packaged statechart compiler and renderer
        working-directory: Codex/plugins/pstack/skills/statechart/scripts
        run: npm test
