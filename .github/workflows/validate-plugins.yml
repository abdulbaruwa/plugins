name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - "pstack/**"
      - "harness/**"
      - "scripts/**"
      - ".github/workflows/validate-plugins.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Check generated pstack harness trees
        run: node scripts/generate-pstack-harness-trees.mjs --check

      - name: Prepare pinned TLC for statechart integration tests
        shell: bash
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check
          echo "JAVA=$JAVA_HOME_17_X64/bin/java" >> "$GITHUB_ENV"
          echo "TLA2TOOLS=$RUNNER_TEMP/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Test pstack skill scripts
        run: node --test pstack/skills/*/scripts/test/*.test.mjs
